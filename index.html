
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON AI</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px;
    text-align: center;
    color: #ff2020;
    border-bottom: 1px solid #6b0000;
    letter-spacing: 4px;
}

main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.core {
    width: 125px;
    height: 125px;
    margin: 20px auto;
    border: 3px solid red;
    border-radius: 50%;
    box-shadow: 0 0 25px red;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% { box-shadow: 0 0 45px red; }
}

.status {
    text-align: center;
    color: #ff3333;
    margin: 20px;
}

#chat {
    height: 350px;
    overflow-y: auto;
    background: #111;
    border: 1px solid #650000;
    padding: 15px;
    border-radius: 8px;
}

.message {
    margin: 12px 0;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user { color: #ff7777; }
.ultron { color: #eeeeee; }

.controls {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    background: #151515;
    border: 1px solid red;
    color: white;
    border-radius: 5px;
}

button {
    padding: 14px 22px;
    background: #b00000;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

footer {
    text-align: center;
    color: #777;
    margin: 35px;
}
</style>
</head>

<body>

<header>
    <h1>ULTRON AI</h1>
    <p>PERSONAL ARTIFICIAL INTELLIGENCE</p>
</header>

<main>

    <div class="core"></div>

    <div class="status" id="status">
        ULTRON SYSTEM READY
    </div>

    <div id="chat">
        <div class="message ultron">
            ULTRON: Hello Creator. I am ready to communicate.
        </div>
    </div>

    <div class="controls">
        <input id="message" type="text"
               placeholder="Talk to ULTRON..."
               autocomplete="off">
        <button id="send" onclick="sendMessage()">SEND</button>
    </div>

</main>

<footer>
    ULTRON AI SYSTEM | CREATOR: EMMANUEL CORNELIUS
</footer>

<script>
const API_URL = "http://127.0.0.1:5000/chat";

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendButton = document.getElementById("send");
const statusText = document.getElementById("status");

function addMessage(sender, message, className) {
    const div = document.createElement("div");
    div.className = "message " + className;

    const label = document.createElement("strong");
    label.textContent = sender + ": ";

    const content = document.createElement("span");
    content.textContent = message;

    div.appendChild(label);
    div.appendChild(content);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
    const message = input.value.trim();

    if (!message || sendButton.disabled) return;

    addMessage("YOU", message, "user");

    input.value = "";
    sendButton.disabled = true;
    statusText.textContent = "ULTRON IS THINKING...";

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: message })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Backend request failed.");
        }

        addMessage("ULTRON", data.reply, "ultron");
        statusText.textContent = "ULTRON ONLINE";

    } catch (error) {
        addMessage(
            "SYSTEM",
            "Could not connect to ULTRON. Check that server.py and Ollama are running. " + error.message,
            "user"
        );

        statusText.textContent = "CONNECTION FAILED";

    } finally {
        sendButton.disabled = false;
        input.focus();
    }
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
