
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULTRON AI</title>
<style>
body {
    background: #080808;
    color: #ff3030;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}
h1 {
    font-size: 48px;
    letter-spacing: 8px;
    text-shadow: 0 0 20px red;
}
.panel {
    background: #151515;
    border: 1px solid red;
    border-radius: 12px;
    padding: 20px;
    margin: 20px auto;
    max-width: 650px;
}
#chat {
    height: 250px;
    overflow-y: auto;
    text-align: left;
    padding: 10px;
    color: white;
}
input {
    padding: 13px;
    width: 65%;
    background: #222;
    color: white;
    border: 1px solid red;
    border-radius: 6px;
}
button {
    padding: 13px;
    background: darkred;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>
<body>

<h1>ULTRON</h1>
<p>ARTIFICIAL INTELLIGENCE SYSTEM</p>

<div class="panel">
<h2>SYSTEM STATUS</h2>
<p style="color:#00ff88">● DASHBOARD ONLINE</p>
<p>CREATOR: EMMANUEL CORNELIUS</p>
</div>

<div class="panel">
<h2>ULTRON AI CHAT</h2>
<div id="chat">
<p>ULTRON: Greetings, Creator. System ready.</p>
</div>

<input id="message" placeholder="Talk to ULTRON...">
<button onclick="sendMessage()">SEND</button>
</div>

<script>
function sendMessage() {
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const message = input.value.trim();

    if (!message) return;

    chat.innerHTML += "<p>You: " + escapeHTML(message) + "</p>";
    chat.innerHTML += "<p>ULTRON: Dashboard communication test successful. My AI brain will be connected in a later step.</p>";

    input.value = "";
    chat.scrollTop = chat.scrollHeight;
}

function escapeHTML(text) {
    const element = document.createElement("div");
    element.textContent = text;
    return element.innerHTML;
}
</script>

</body>
</html>
