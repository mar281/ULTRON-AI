
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON AI</title>

<style>
body {
    background: #080808;
    color: #ff3030;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
}

h1 {
    font-size: 55px;
    letter-spacing: 8px;
    text-shadow: 0 0 20px red;
}

.panel {
    border: 1px solid red;
    padding: 25px;
    margin: 20px auto;
    max-width: 600px;
    background: #151515;
    box-shadow: 0 0 20px #550000;
    border-radius: 12px;
}

.status {
    color: #00ff88;
    font-size: 20px;
}

button {
    background: #b00000;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>ULTRON</h1>
<p>ARTIFICIAL INTELLIGENCE SYSTEM</p>

<div class="panel">
    <h2>SYSTEM STATUS</h2>
    <p class="status">● SYSTEM ONLINE</p>
    <p>AI CORE: PREPARED</p>
    <p>VOICE: PREPARED</p>
    <p>MEMORY: PREPARED</p>
</div>

<div class="panel">
    <h2>CREATOR</h2>
    <p>EMMANUEL CORNELIUS</p>
</div>

<div class="panel">
    <h2>ULTRON CONTROL</h2>
    <button onclick="alert('ULTRON dashboard is ready!')">
        INITIALIZE
    </button>
</div>

</body>
</html>
